name: Nightly maintenance
# Runs scheduled-maintenance once a day at 00:00 Sri Lanka time (18:30 UTC).
# Needs two repository secrets: FUNCTIONS_URL (https://YOUR-REF.supabase.co/functions/v1) and CRON_SECRET (from `npm run secrets:generate`).
# GitHub may pause scheduled workflows in repositories with no activity for 60 days [VERIFY]; the Actions tab shows a banner if so.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduled-maintenance
        env:
          FUNCTIONS_URL: ${{ secrets.FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error -X POST "$FUNCTIONS_URL/scheduled-maintenance" -H "x-cron-secret: $CRON_SECRET"
